<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blog • Patience Agyiri Andoh</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  /* Lilac theme */
  --bg:#E9DEF9;
  --bg-2:#f5effd;
  --card:#ffffff;
  --text:#121225;
  --muted:#6b6880;
  --line:#e8e4f4;
  --badge:#3b3b4f;
  --accent:#6B46C1;
  --accent2:#22D3EE;
  --radius:22px;
  --shadow:0 18px 55px rgba(39,18,74,.15);
}
[data-theme="dark"]{
  --bg:#171528;
  --bg-2:#1f1b36;
  --card:#1f1d33;
  --text:#f2edff;
  --muted:#bfb8d8;
  --line:#2a2546;
  --badge:#2b2a3d;
  --accent:#B794F4;
  --accent2:#38E2FF;
  --shadow:0 22px 60px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
body{
  margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);
  background:
    radial-gradient(1200px 600px at -10% -10%, rgba(155,135,245,.25), transparent 60%),
    radial-gradient(900px 500px at 110% 0%, rgba(34,211,238,.18), transparent 55%),
    linear-gradient(180deg,var(--bg),var(--bg-2));
  min-height:100dvh;
}

/* Glass header */
header{
  position:sticky;top:0;z-index:10;
  backdrop-filter:saturate(140%) blur(10px);
  background:linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,.15));
  border-bottom:1px solid rgba(255,255,255,.35);
}
.bar{max-width:1100px;margin:auto;padding:.8rem 1rem;display:flex;gap:12px;align-items:center}
.back{
  width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--text);text-decoration:none;border-radius:14px;
  background:rgba(255,255,255,.45);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);
  transition:transform .2s ease; 
}
.back:hover{transform:translateX(-3px)}
.spacer{flex:1}

/* Theme pill */
.theme-pill{
  position:fixed;top:12px;right:12px;z-index:20;
  display:flex;gap:2px;padding:4px;border-radius:999px;
  background:rgba(255,255,255,.7);backdrop-filter:blur(8px);
  box-shadow:0 10px 25px rgba(0,0,0,.12);
}
.theme-pill button{
  border:0;border-radius:999px;padding:.45rem .85rem;cursor:pointer;
  font-weight:600;background:transparent;color:#444;
}
.theme-pill button.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#0b1020;
}

/* Page */
main{max-width:1100px;margin:0 auto;padding:1.2rem 1rem 2.2rem}
h1{font-size:1.95rem;margin:0 0 .9rem;color:var(--accent)}

/* Card list */
.stack{display:grid;gap:18px}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); overflow:hidden;
  transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
}
.card:hover{transform:translateY(-6px); box-shadow:0 26px 60px rgba(39,18,74,.20)}

.thumb{
  position:relative; border-bottom:1px solid var(--line);
  border-radius:calc(var(--radius) - 2px) calc(var(--radius) - 2px) 0 0;
  overflow:hidden;
  /* gradient image feel */
  background:
    linear-gradient(120deg, rgba(155,135,245,.35), rgba(34,211,238,.28)),
    linear-gradient(180deg, rgba(255,255,255,.8), rgba(255,255,255,0)),
    url('https://images.unsplash.com/photo-1520975922131-c3c81cd1ccd1?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat;
  min-height:150px;
}
.thumb.debate{
  background:
    linear-gradient(120deg, rgba(107,70,193,.35), rgba(6,182,212,.3)),
    url('https://images.unsplash.com/photo-1551836022-d5d88e9218df?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat;
}

.badge{
  position:absolute; left:14px; bottom:14px;
  background:var(--badge); color:#fff; font-size:.8rem; font-weight:600;
  padding:.35rem .6rem; border-radius:11px; display:inline-flex; gap:.4rem; align-items:center;
  box-shadow:0 6px 14px rgba(0,0,0,.15);
}

/* Body */
.body{padding:16px 18px}
.title{margin:0 0 .4rem; font-size:1.25rem}
.meta{display:flex; gap:14px; color:var(--muted); font-size:.92rem; align-items:center}
.meta i{opacity:.9}
.cta{
  display:inline-flex; gap:.55rem; align-items:center; margin-top:12px; font-weight:800;
  text-decoration:none; color:#0b1020; border-radius:14px; padding:.6rem .9rem;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 8px 22px rgba(43,18,88,.25); transition:transform .2s ease;
}
.cta:hover{transform:translateY(-2px)}

/* Responsive radius for mobile feel */
@media (max-width:560px){
  .card{border-radius:18px}
}

/* Motion */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{animation:fadeUp .45s ease both}
.card:nth-child(2){animation-delay:.06s}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important}
}
</style>
</head>
<body>

<!-- floating theme pill -->
<div class="theme-pill" role="group" aria-label="Theme">
  <button id="lightBtn" class="active" onclick="setTheme('light')">Light</button>
  <button id="darkBtn" onclick="setTheme('dark')">Dark</button>
</div>

<header>
  <div class="bar">
    <a class="back" href="javascript:history.back()" aria-label="Back">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <div class="spacer"></div>
  </div>
</header>

<main>
  <h1>Explore my writing</h1>

  <section class="stack">
    <!-- Card 1 -->
    <article class="card">
      <div class="thumb">
        <span class="badge"><i class="fa-solid fa-flask"></i> Cancer Biology</span>
      </div>
      <div class="body">
        <h2 class="title">Cancer Biology Series</h2>
        <div class="meta">
          <span><i class="fa-regular fa-clock"></i> 8–12 min reads</span>
        </div>
        <a class="cta" href="cancer.html"><i class="fa-solid fa-book-open"></i> Read series</a>
      </div>
    </article>

    <!-- Card 2 -->
    <article class="card">
      <div class="thumb debate">
        <span class="badge"><i class="fa-solid fa-microphone-lines"></i> Debate &amp; Notes</span>
      </div>
      <div class="body">
        <h2 class="title">My Debate Experience</h2>
        <div class="meta">
          <span><i class="fa-regular fa-clock"></i> 4–7 min reads</span>
        </div>
        <a class="cta" href="articles.html"><i class="fa-solid fa-arrow-right"></i> View posts</a>
      </div>
    </article>
  </section>
</main>

<script>
function setTheme(mode){
  document.documentElement.setAttribute('data-theme', mode === 'dark' ? 'dark' : 'light');
  localStorage.setItem('theme', mode);
  document.getElementById('lightBtn').classList.toggle('active', mode==='light');
  document.getElementById('darkBtn').classList.toggle('active', mode==='dark');
}
(function initTheme(){
  const saved = localStorage.getItem('theme') || 'light';
  setTheme(saved);
})();
</script>
</body>
</html>
