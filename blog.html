<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Blog • Patience Agyiri Andoh</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{
    --bg:#0f0f14;
    --surface:#151823;
    --card:#111420;
    --text:#e7e9ee;
    --muted:#9aa3b2;
    --accent:#9b87f5;
    --accent-2:#22d3ee;
    --ring:rgba(155,135,245,.45);
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --radius:16px;
  }
  [data-theme="light"]{
    --bg:#f7f7fb;
    --surface:#ffffff;
    --card:#ffffff;
    --text:#0f1222;
    --muted:#5b6474;
    --accent:#6b46c1;
    --accent-2:#06b6d4;
    --ring:rgba(107,70,193,.25);
    --shadow:0 10px 30px rgba(17,24,39,.08);
  }
  *{box-sizing:border-box}
  body{
    margin:0;color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
    background:
      radial-gradient(1200px 600px at -10% -10%, rgba(155,135,245,.25), transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, rgba(34,211,238,.18), transparent 55%),
      var(--bg);
    min-height:100dvh;
  }
  header{
    position:sticky;top:0;z-index:10;
    backdrop-filter:saturate(140%) blur(10px);
    background:linear-gradient(180deg, rgba(17,17,27,.6), rgba(17,17,27,.35)) ;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .bar{max-width:1100px;margin:auto;padding:.8rem 1rem;display:flex;align-items:center;gap:12px}
  .back{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;
    border:1px solid rgba(255,255,255,.12);border-radius:12px;color:var(--text);text-decoration:none}
  .spacer{flex:1}
  .select{
    appearance:none;background:var(--surface);color:var(--text);border:1px solid rgba(255,255,255,.12);
    padding:.55rem 2rem .55rem .8rem;border-radius:12px;position:relative;
  }
  main{max-width:1100px;margin:0 auto;padding:2.2rem 1rem 3rem}
  .hero{
    background:linear-gradient(135deg, rgba(155,135,245,.18), rgba(34,211,238,.14));
    border:1px solid var(--ring);border-radius:20px;padding:1.8rem;box-shadow:var(--shadow);
  }
  .hero h1{margin:.2rem 0 0;font-size:clamp(1.6rem,2.2vw,2.2rem)}
  .hero p{margin:.5rem 0 0;color:var(--muted)}
  .grid{
    margin-top:1.4rem;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;
  }
  .card{
    background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);transition:transform .25s ease, box-shadow .25s ease, border-color .25s;
  }
  .card:hover{transform:translateY(-4px);border-color:var(--ring);box-shadow:0 18px 40px rgba(0,0,0,.35)}
  .thumb{
    aspect-ratio:16/9;background:
      linear-gradient(120deg, rgba(155,135,245,.3), rgba(34,211,238,.25)),
      url('https://images.unsplash.com/photo-1520975922131-c3c81cd1ccd1?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat;
    display:flex;align-items:flex-end;justify-content:flex-start;padding:10px;color:white;
  }
  .thumb[data-type="debate"]{
    background:
      linear-gradient(120deg, rgba(107,70,193,.35), rgba(6,182,212,.3)),
      url('https://images.unsplash.com/photo-1551836022-d5d88e9218df?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat;
  }
  .badge{
    background:rgba(17,24,39,.55);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.18);
    padding:.25rem .5rem;border-radius:10px;font-size:.75rem
  }
  .body{padding:14px}
  .title{display:flex;gap:.5rem;align-items:center;margin:0 0 .3rem}
  .title a{color:var(--text);text-decoration:none;font-weight:700}
  .meta{display:flex;gap:10px;color:var(--muted);font-size:.85rem}
  .meta i{opacity:.8}
  .cta{
    display:inline-flex;gap:.5rem;align-items:center;margin-top:.8rem;padding:.55rem .8rem;
    border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#0b1020;text-decoration:none;font-weight:700;border:0;
  }
  /* mobile */
  @media (max-width:560px){ .hero{padding:1.2rem} .thumb{aspect-ratio:16/10} }
</style>
</head>
<body data-theme="light">
<header>
  <div class="bar">
    <a class="back" href="javascript:history.back()" aria-label="Go back"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="spacer"></div>
    <select id="themeSelect" class="select" aria-label="Theme" onchange="changeTheme(this.value)">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>
</header>

<main>
  <section class="hero">
    <h1>Explore my writing</h1>
    <p>Deep dives on cancer biology and notes from debates and experiences.</p>
    <div class="grid">
      <!-- Card 1 -->
      <article class="card">
        <div class="thumb" data-type="science">
          <span class="badge"><i class="fa-solid fa-flask"></i> Cancer Biology</span>
        </div>
        <div class="body">
          <h3 class="title"><a href="cancer.html">Cancer Biology Series</a></h3>
          <div class="meta">
            <span><i class="fa-regular fa-calendar"></i> Updated weekly</span>
            <span><i class="fa-regular fa-clock"></i> 8–12 min reads</span>
          </div>
          <a class="cta" href="cancer.html"><i class="fa-solid fa-book-open"></i> Read series</a>
        </div>
      </article>

      <!-- Card 2 -->
      <article class="card">
        <div class="thumb" data-type="debate">
          <span class="badge"><i class="fa-solid fa-microphone-lines"></i> Debate & Notes</span>
        </div>
        <div class="body">
          <h3 class="title"><a href="articles.html">My Debate and Experience</a></h3>
          <div class="meta">
            <span><i class="fa-regular fa-calendar"></i> New posts monthly</span>
            <span><i class="fa-regular fa-clock"></i> 4–7 min reads</span>
          </div>
          <a class="cta" href="articles.html"><i class="fa-solid fa-arrow-right"></i> View posts</a>
        </div>
      </article>
    </div>
  </section>
</main>

<script>
  // theme
  function changeTheme(mode){
    document.body.setAttribute('data-theme', mode === 'dark' ? '' : 'light'); // reset then set
    if(mode === 'dark') document.body.removeAttribute('data-theme');
    localStorage.setItem('theme', mode);
    document.documentElement.setAttribute('data-theme', mode === 'dark' ? '' : 'light');
  }
  // load saved theme
  (() => {
    const saved = localStorage.getItem('theme') || 'light';
    document.getElementById('themeSelect').value = saved;
    document.documentElement.setAttribute('data-theme', saved);
    document.body.setAttribute('data-theme', saved);
  })();
</script>
</body>
</html>
